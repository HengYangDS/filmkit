[project]
name = "filmkit"
dynamic = ["version"]
description = "Rebuild narrated bilingual explainer films from their tracked sources"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "mlx-audio==0.6.4",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "pydantic==2.14.3",
  "pypinyin==0.55.0",
  "snowballstemmer==3.1.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

# Resolve stable releases only, as uv.lock records; `uv run --locked` refuses a lock that was
# resolved in another prerelease mode. An editable install is rebuilt when VERSION changes, so
# the metadata it reports, and the gate records that read it, name the engine that runs.
[tool.uv]
prerelease = "disallow"
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

# VERSION is the only version source, as ETHOS requires of a repository that tags releases;
# uv_build reads no dynamic version, so hatchling builds the package. The wheel carries the
# Node tools beside the modules that run them.
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>\\S+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/filmkit"]

[dependency-groups]
dev = [
  "coverage==7.17.2",
  "fonttools==4.68.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-reportlog==1.0.0",
]
