min_version = "2026.10.14"

[settings]
locked = true
minimum_release_age = "24h"
# Apple-silicon macOS (owner, 2026-11-25) and the lock's Linux ones (the ETHOS session, 15:09).
lockfile_platforms = ["linux-arm64", "linux-arm64-musl", "linux-x64", "linux-x64-musl", "macos-arm64"]

# npm reads this repository's own configuration, which holds npm's release age. npm treats
# environment names case-insensitively, so its lower-case alias is removed.
[env]
npm_config_userconfig = false
NPM_CONFIG_USERCONFIG = "{{ config_root }}/.config/npm/npmrc"

# The repository's common verbs; the npm scripts and the frozen uv environment they call own the commands.
[tasks.bootstrap]
description = "Prepare the frozen Python environment and the locked npm packages"
run = ["uv sync --python 3.12 --frozen --group dev", "npm ci --include=dev"]
depends_post = ["check:dependencies"]

[tasks."check:dependencies"]
description = "Verify that the lock is current and the installed dependency graphs match the frozen inputs"
run = [
  "uv lock --python 3.12 --check --offline",
  "uv sync --python 3.12 --frozen --check --offline --group dev",
  "uv run --python 3.12 --frozen --offline --no-sync --group dev uv pip check",
  "npm ls --all --include=dev",
]

[tasks.check]
description = "Run the engine's Node and Python tests and check the Markdown formatting without writing"
depends = ["check:dependencies"]
run = [
  "npm test",
  "npm run format:markdown:check",
  "uv run --python 3.12 --frozen --offline --group dev python -m pytest -q tests",
]

[tasks.fix]
description = "Apply the Markdown formatter to the files it owns and write the engine's record of what it was released on"
run = [
  "npm run format:markdown",
  "uv run --python 3.12 --frozen --offline python -m filmkit.released",
]

# The sample film's build by the engine's verbs, run in its folder, where the engine finds the film;
# its npm packages are this repository's. Only sample:supply reaches the network; HF_ENDPOINT names
# a Hugging Face mirror where the hub is unreachable. sample:narrate is GPU work, and sample:build
# runs `filmkit build all`, which names the light build to run first, outside any ticket, and then
# each heavy invocation, each the child of its host ticket; `filmkit plan` prints what each node
# took.
[tasks."sample:supply"]
description = "Install the pinned browser build, CMUdict and speech models below the sample film's tool cache"
dir = "{{config_root}}/examples/sample-film"
run = "uv run --python 3.12 --frozen --offline filmkit supply"

[tasks."sample:check"]
description = "Ask every question of the sample film's sources at once, the source check's run"
dir = "{{config_root}}/examples/sample-film"
run = "uv run --python 3.12 --frozen --offline filmkit check"

[tasks."sample:narrate"]
description = "Narrate both editions of the sample film until every thought holds an accepted take"
dir = "{{config_root}}/examples/sample-film"
run = "uv run --python 3.12 --frozen --offline filmkit narrate --edition all"

[tasks."sample:build"]
description = "Build both sample editions from their narration, as the run records ask"
dir = "{{config_root}}/examples/sample-film"
run = "uv run --python 3.12 --frozen --offline filmkit build all"

[tasks."sample:verify"]
description = "Verify the sample's run records and both editions' films; a rebuild carries no review"
dir = "{{config_root}}/examples/sample-film"
run = "uv run --python 3.12 --frozen --offline filmkit verify --technical-only"

# The ETHOS gates resolve these only from this lock, never from PATH: Node for the picture checks,
# Python and uv for the suite. Python stays on the 3.12 line that the films select. Vale applies
# the register check's style (`filmkit.register`) at the version ETHOS pins; the engine's record
# of what it was released on states it.
[tools]
node = "26.13.1"
python = "3.12.16"
uv = "0.13.9"
"github:vale-cli/vale" = "3.27.0"

# The ETHOS release declaration published with v0.2.0-beta.12, without its two Windows rows.
[tools."http:ethos"]
version = "0.2.0-beta.12"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.12/ethos-0.2.0-beta.12-linux-arm64.tar.gz", checksum = "sha256:b7eb93ada12f82f9c755562429367a5e2792a1a2c96013598382fc08a16c873d", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.12/ethos-0.2.0-beta.12-linux-x64.tar.gz", checksum = "sha256:e5e4a390c9a7616067522606160dc0cc63ee8725acd54b30ab3df89b6cf286f0", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.12/ethos-0.2.0-beta.12-macos-arm64.tar.gz", checksum = "sha256:71929b950100188c39a76026e4ff6a6d2d7a35a8fda608483e1e9b2a18729f59", bin_path = "ethos/bin" }
