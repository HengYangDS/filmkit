<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Sample Reel · From Sources to Film</title>
  <link rel="stylesheet" href="film.css">
</head>
<body>
  <div id="film" data-width="1920" data-height="1080" data-duration="1200">
    <canvas id="picture" width="1920" height="1080"></canvas>
    <div class="font-probe">示例影片 Sample Reel</div>
    <div class="font-probe bold">示例影片 Sample Reel</div>
  </div>
  <script>/* FILM_DATA */</script>
  <script src="film.js"></script>
  <script>
    window.__filmReady = Promise.all([
      document.fonts.load('30px Sample'), document.fonts.load('700 30px SampleBold'),
      document.fonts.load('30px SampleLatin'), document.fonts.load('700 30px SampleLatinBold')
    ]).then(() => document.fonts.ready).then(() => window.renderFrame(0));
  </script>
</body>
</html>
