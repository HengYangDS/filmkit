# The sample film that this repository's tests load and its local acceptance builds. The engine
# takes every film-specific value from this declaration and the files it names; each edition's
# script declares its title, author, language, duration, frame rate and chapters. Paths are below
# this folder.

# The prefix of every delivered file.
slug = "sample-reel"
# The folder in ~/Documents that a delivery would fill.
documents_folder = "sample-reel"
# The page that leads to each edition's player.
entry = "content/index.html"
# The commit and digest of the document the film explains.
source_manifest = "content/source-manifest.json"
# What each concept the film names means in that document, and each edition's words for it.
concepts = "content/concepts.toml"

# Each edition's folder of script and cast, its 16:9 cover, and the summary its player shows
# under the film.
[editions.zh]
sources = "content"
cover = "assets/cover/sample-reel-cover.png"
summary = "这部一分钟的短片演示一部影片怎样从源文件重建出来。片中的步骤依据 ddwg-film 的 README。"

[editions.en]
sources = "content/en"
cover = "assets/cover/sample-reel-cover-en.png"
summary = "A one-minute film that shows how a film is rebuilt from its sources. The steps it names follow the ddwg-film README."
# A term that reads as one name stays on one caption line.
caption_terms = ["reference recording", "build folder"]

# The fonts the picture stages below fonts/, in this order: Noto Sans CJK SC, subset to the
# characters the film draws, for any text with a Chinese character, and IBM Plex Sans, unmodified,
# for Latin-only text.
[picture]
fonts = [
  "assets/fonts/noto-sans-cjk-sc-subset-regular.otf",
  "assets/fonts/noto-sans-cjk-sc-subset-bold.otf",
  "assets/fonts/ibm-plex-sans-regular.ttf",
  "assets/fonts/ibm-plex-sans-bold.ttf",
]

# The colours of each edition's player page: its ground, text, quieter text, rules and outlines,
# and the accent of a chosen or focused control.
[player]
background = "#0F1519"
text = "#ECE8DF"
muted = "#9BA8B1"
line = "#34424E"
accent = "#7DB7D8"

[review]
# The reviewer prompt: a str.format template that each round fills for each edition.
prompt = "content/review/prompt.md"
# The listening plan's analyst readings: the part of speech of each English heteronym occurrence,
# keyed by segment and offset in the script.
readings = "content/review/readings.json"
# The verifier's floor: the overall score and every dimension at least this.
overall_minimum = 95
dimension_minimum = 95
# The voice-clarity floors: the median cepstral peak prominence, in dB, that each edition's voice
# should reach over its loud speech frames. The review's measurement records each soundtrack's
# and each segment's clarity against them.
clarity_minimum_db = { zh = 18.0, en = 17.0 }

# The scored dimensions in record order, with what each one asks reviewers to judge.
[review.dimensions]
subject_and_faithfulness = """\
  the rebuild of a film from its sources remains the subject; every statement follows the cited \
  README; the stages appear in the order they run."""
concept_fidelity = """\
  each concept the film names keeps its source meaning as the concept contract quotes it, in \
  the edition's one rendering through narration, captions, titles and picture; no rendering \
  narrows, personifies, substitutes or literally translates a concept."""
narration_and_language = """\
  natural delivery with audible phrase tails and distinct thought pauses; idiomatic language in \
  each edition; consistent terms."""
picture_and_sync = """\
  each scene shows what the narration names as it is named; captions, cards and scene changes \
  stay in sync; no collisions or clipping."""
deliverable_craft = """\
  cover, credits and metadata name the film and its author; subtitles and transcript match the \
  speech; chapters and player work."""

# The review's three levels, which a first-time viewer judges the whole film by: each asks one
# thing of the film and holds some of the dimensions, every dimension in one level. A review passes
# only when each level does, with every dimension it holds at the floor and no material finding.
[review.levels."信"]
asks = """\
  faithful: every statement says what the cited README says, in its order, and each concept keeps \
  its one rendering and its meaning in both editions."""
dimensions = ["subject_and_faithfulness", "concept_fidelity"]

[review.levels."达"]
asks = """\
  conveyed: a newcomer understands each sentence on first hearing and the picture shows what is \
  said as it is said."""
dimensions = ["narration_and_language", "picture_and_sync"]

[review.levels."雅"]
asks = """\
  graceful: the words are what a fluent speaker would say, and the cover, credits, files and \
  player are finished."""
dimensions = ["deliverable_craft"]
