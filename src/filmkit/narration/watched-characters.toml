# The Mandarin characters whose reading a narrator can confuse, which every film that declares a
# pronunciation contract of schema version 2 must declare wherever its Chinese narration says them.
# The readings check refuses any occurrence that no declared word covers.

[word]
# Each has more than one reading where it stands alone, so an occurrence must lie in a declared word
# of two or more characters, whose reading the context fixes.
characters = "重行长只调处当相数种为得地觉教散转落划干结尽场斗应供空系担冲量曾薄背露盛率宿载屏倒卡吐待炸血铺缝卷曲"

[character]
# Each has one reading wherever it stands alone and others only inside known words, so a declared
# single character may cover its occurrences outside the declared words. The dictionary check still
# refuses a single character where the context reads it otherwise.
characters = "还都着的要会和说看没大把什片了中分模更正间几将奇强角发给号好圈累舍钻参恶难解便差降朝藏传似塞称识乐校少省劲假切答漂脏冠创兴"
