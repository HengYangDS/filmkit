# R2 of the formal register (`standard.md`): a first person plural stands only for a party the
# film has named, which no word can tell, so it is a warning for the reviewers. Its English forms
# match with a lower-case or a capital first letter only: that spares the country (US) and costs
# WE and OUR in capitals.
extends: existence
message: "'%s' is a first person plural: only for a party the film has named (R2)"
level: warning
scope: paragraph
nonword: true
tokens:
  - '我们'
  - '(?<![A-Za-z])(?:[Ww]e|[Uu]s|[Oo]urs?|[Oo]urselves)(?![A-Za-z])'
tests:
  - name: every form
    input: |
      我们发现，We found that our tools, and ours alone, told us so; we’re sure ourselves.
    contains:
      - '''我们'''
      - '''We'''
      - '''our'''
      - '''ours'''
      - '''us'''
      - '''we'''
      - '''ourselves'''
  - name: the country and words that hold a form
    input: |
      The US market uses web tools for the user and the bus.
    want: ""
