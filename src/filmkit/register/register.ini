# The register check's Vale configuration (`filmkit.register`): the engine's base style alone, on
# the plain text the check renders and passes on stdin. The settings of every text stand under
# `[DEFAULT]`, the section an INI file's own keys belong to, so that the file is INI to any reader.
[DEFAULT]
StylesPath = styles
MinAlertLevel = suggestion

[*.txt]
BasedOnStyles = register
